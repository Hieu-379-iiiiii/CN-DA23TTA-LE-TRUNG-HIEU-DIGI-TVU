<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <style>
    .skill-pentagon-container {
        width: 100%;
        max-width: 500px;
        aspect-ratio: 1;
        margin: auto;
    }

    .pentagon-svg {
        width: 100%;
        height: 100%;
    }

    .skill-sector {
        cursor: pointer;
        transform-origin: 250px 250px;
        transition: transform 0.3s ease;
    }


    .skill-sector {
        cursor: pointer;
        transform-origin: 250px 250px;
        transition:
            transform 0.3s ease,
            filter 0.3s ease;
    }

    .sector-polygon {
        fill-opacity: 0.9;
        stroke-width: 2.5;
        stroke-linejoin: round;
        transition: fill-opacity 0.2s ease;
    }

    .skill-sector:hover .sector-polygon,
    .skill-sector.active-sector .sector-polygon {
        fill-opacity: 1;
    }

    /* Sector animations */
    #sector-1:hover,
    #sector-1.active-sector {
        transform: translate(12px, -18px);
        filter: drop-shadow(0 15px 25px rgba(59, 130, 246, 0.75));
    }

    #sector-2:hover,
    #sector-2.active-sector {
        transform: translate(18px, 18px);
        filter: drop-shadow(0 15px 25px rgba(247, 171, 85, 0.75));
    }

    #sector-3:hover,
    #sector-3.active-sector {
        transform: translate(0px, 20px);
        filter: drop-shadow(0 15px 25px rgba(16, 185, 129, 0.75));
    }

    #sector-4:hover,
    #sector-4.active-sector {
        transform: translate(-18px, 18px);
        filter: drop-shadow(0 15px 25px rgba(245, 158, 11, 0.75));
    }

    #sector-5:hover,
    #sector-5.active-sector {
        transform: translate(-12px, -18px);
        filter: drop-shadow(0 15px 25px rgba(244, 63, 94, 0.75));
    }


    
    .sector-polygon {
        fill-opacity: 0.9;
        stroke-width: 2.5;
        stroke-linejoin: round;
        transition: fill-opacity 0.2s ease;
    }

    .skill-sector:hover .sector-polygon, .sector-polygon {
        fill-opacity: 1;
    }

    .sector-label {
        pointer-events: none;
        user-select: none;
    }

    #sector-1 .sector-polygon { fill: #3b82f6; stroke: #93c5fd; }
    #sector-2 .sector-polygon { fill: #f59e0b; stroke: #fcd34d; }
    #sector-3 .sector-polygon { fill: #10b981; stroke: #6ee7b7; }
    #sector-4 .sector-polygon { fill: #eab308; stroke: #fde047; }
    #sector-5 .sector-polygon { fill: #f43f5e; stroke: #fda4af; }
    </style>

    <div class="skill-pentagon-container">
        <svg class="pentagon-svg"
            viewBox="0 0 500 500"
            role="img"
            aria-label="5 Competence Areas">

            <!-- Center -->
            <polygon
                points="250,193 298,228 279,284 221,284 202,228"
                fill="#0f172a"
                stroke="#64748b"
                stroke-width="1.5"
            />

            <text x="250" y="246" text-anchor="middle"
                fill="#e2e8f0" font-size="11"
                font-weight="700" letter-spacing="1.2">
                DIGITAL
            </text>

            <text x="250" y="261" text-anchor="middle"
                fill="#94a3b8" font-size="9.5"
                font-weight="600" letter-spacing="0.8">
                CORE
            </text>

            <!-- Sector 1 -->
            <g id="sector-1"
            class="skill-sector"
            onmouseenter="previewSector(1)"
            onclick="openModal(1)">

                <polygon class="sector-polygon"
                    points="250,193 250,60 410,176 346,206 298,228"/>

                <g class="sector-label" transform="translate(308, 152)">
                    <text x="0" y="-6" text-anchor="middle"
                        fill="#fff" font-size="11.5" font-weight="800">
                        01 • INFO
                    </text>
                    <text x="0" y="9" text-anchor="middle"
                        fill="#dbeafe" font-size="9.5" font-weight="600">
                        Search &amp; Data
                    </text>
                </g>
            </g>

            <!-- Sector 2 -->
            <g id="sector-2"
            class="skill-sector"
            onmouseenter="previewSector(2)"
            onclick="openModal(2)">

                <polygon class="sector-polygon"
                    points="298,228 346,206 410,176 348,364 309,318 279,284"/>

                <g class="sector-label" transform="translate(342, 266)">
                    <text x="0" y="-6" text-anchor="middle"
                        fill="#fff" font-size="11.5" font-weight="800">
                        02 • COMM
                    </text>
                    <text x="0" y="9" text-anchor="middle"
                        fill="#fef3c7" font-size="9.5" font-weight="600">
                        Collaborate
                    </text>
                </g>
            </g>

            <!-- Sector 3 -->
            <g id="sector-3"
            class="skill-sector"
            onmouseenter="previewSector(3)"
            onclick="openModal(3)">

                <polygon class="sector-polygon"
                    points="279,284 309,318 348,364 152,364 191,318 221,284"/>

                <g class="sector-label" transform="translate(250, 330)">
                    <text x="0" y="-6" text-anchor="middle"
                        fill="#fff" font-size="11.5" font-weight="800">
                        03 • CREATE
                    </text>
                    <text x="0" y="9" text-anchor="middle"
                        fill="#d1fae5" font-size="9.5" font-weight="600">
                        Digital Content
                    </text>
                </g>
            </g>

            <!-- Sector 4 -->
            <g id="sector-4"
            class="skill-sector"
            onmouseenter="previewSector(4)"
            onclick="openModal(4)">

                <polygon class="sector-polygon"
                    points="221,284 191,318 152,364 90,176 154,206 202,228"/>

                <g class="sector-label" transform="translate(158, 266)">
                    <text x="0" y="-6" text-anchor="middle"
                        fill="#fff" font-size="11.5" font-weight="800">
                        04 • SAFETY
                    </text>
                    <text x="0" y="9" text-anchor="middle"
                        fill="#fef9c3" font-size="9.5" font-weight="600">
                        &amp; Wellbeing
                    </text>
                </g>
            </g>

            <!-- Sector 5 -->
            <g id="sector-5"
            class="skill-sector"
            onmouseenter="previewSector(5)"
            onclick="openModal(5)">

                <polygon class="sector-polygon"
                    points="202,228 154,206 90,176 250,60 250,193"/>

                <g class="sector-label" transform="translate(192, 152)">
                    <text x="0" y="-6" text-anchor="middle"
                        fill="#fff" font-size="11.5" font-weight="800">
                        05 • SOLVE
                    </text>
                    <text x="0" y="9" text-anchor="middle"
                        fill="#ffe4e6" font-size="9.5" font-weight="600">
                        Problem Solving
                    </text>
                </g>
            </g>

        </svg>
    </div>

    
</body>
</html>
